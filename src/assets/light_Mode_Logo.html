<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IU ACM Logo</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
    }

    .logo-badge {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
    }

    .logo-bracket {
      color: #2c5f85; /* Matches --acm-blue */
      font-weight: 500;
    }

    .logo-text {
      color: #c49b57; /* Matches --acm-gold */
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <div class="logo-badge">
    <span class="logo-bracket">{</span><span class="logo-text">acm</span><span class="logo-bracket">}</span>
  </div>

</body>
</html>
